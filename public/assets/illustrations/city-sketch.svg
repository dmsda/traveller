<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%" fill="none" stroke="#D3C9BF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.45">
